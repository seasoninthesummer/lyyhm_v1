<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=0,viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <title>Loading...</title>
  <style>
    :root {
      --bg: #fff;
      --text: #1a1a1a;
      --subtle: #8c8c8c;
      --wx: #07c160;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    img { max-width: 100%; display: block; }
    #app { display: none; min-height: 100vh; }
    .page { min-height: 100vh; display: flex; flex-direction: column; }
    .safe-banner {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 16px;
      background: #f7fbf8;
      border-bottom: 1px solid #eef8f1;
      color: var(--wx);
      font-size: 15px;
      font-weight: 600;
      flex-shrink: 0;
    }
    .safe-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: rgba(7, 193, 96, 0.1);
      color: var(--wx);
      flex-shrink: 0;
    }
    .main {
      flex: 1;
      width: 100%;
      max-width: 100%;
      margin: 0 auto;
      padding: 4px 0 12px;
    }
    .page-title {
      margin: 0 0 8px;
      font-size: 18px;
      line-height: 1.45;
      text-align: center;
      font-weight: 600;
      color: var(--text);
      padding: 0 2%;
    }
    .note {
      margin: 8px 2% 0;
      line-height: 1.7;
      font-size: 14px;
      text-align: center;
      white-space: pre-line;
      word-break: break-word;
      color: var(--subtle);
    }
    .media-wrap {
      width: 100%;
      margin: 0 auto;
      display: flex;
      justify-content: center;
    }
    .qrcode-link, .media-link {
      display: block;
      width: 96%;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }
    .qrcode-box, .media-box { width: 96%; }
    .qrcode-link img, .qrcode-box img, .media-link img, .media-box img {
      width: 100%;
      max-height: 80vh;
      height: auto;
      object-fit: contain;
      display: block;
      border-radius: 12px;
    }
    .warn-box {
      text-align: center;
      padding: 24px 16px;
    }
    .warn-icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 16px;
      border-radius: 50%;
      background: #fef3c7;
      color: #d97706;
      font-size: 36px;
      line-height: 72px;
    }
    .warn-text { font-size: 16px; font-weight: 600; line-height: 1.7; }
    .warn-sub { margin-top: 10px; color: var(--subtle); font-size: 14px; }
    .copy-button {
      width: 180px;
      height: 46px;
      margin: 28px auto 0;
      border: 1px solid var(--primary);
      border-radius: 999px;
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      cursor: pointer;
    }
    #loading {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      color: var(--subtle);
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(37, 99, 235, 0.2);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    body.iframe-mode,
    body.iframe-mode #app {
      margin: 0;
      padding: 0;
      min-height: 100%;
      height: 100%;
      background: #fff;
      overflow: hidden;
    }
    body.iframe-mode #app {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 100vh;
      min-height: 100dvh;
    }
    .lc-full-iframe {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #fff;
    }
  </style>
</head>
<body>
<div id="loading">
  <div class="spinner"></div>
  <div>加载中…</div>
</div>
<div id="app"></div>
<script>
  (function () {
    function getParam(name) {
      var m = new RegExp('[?&]' + name + '=([^&]*)').exec(location.search);
      return m ? decodeURIComponent(m[1].replace(/\+/g, ' ')) : '';
    }

    function getApiBase() {
      var fromParam = getParam('api_base');
      if (fromParam) return fromParam.replace(/\/$/, '');
      if (location.protocol.indexOf('http') === 0 && location.host) {
        return location.protocol + '//' + location.host;
      }
      return 'https://lyyhm.com';
    }

    function getGateKey() {
      return getParam('key') || getParam('qun_key') || getParam('tk') || getParam('code') || '';
    }

    function escapeHtml(s) {
      return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function hideLoading() {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('app').style.display = 'block';
    }

    function isLikelyDesktopBrowser() {
      var ua = navigator.userAgent || '';
      var android = /Android/i.test(ua);
      var iphone = /iPhone|iPod/i.test(ua);
      var mobileUA = /Android|webOS|iPhone|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua);
      if (!mobileUA) return true;
      if (/iPad|Tablet|PlayBook|Silk/i.test(ua)) return false;
      if (navigator.userAgentData && navigator.userAgentData.mobile === true) return false;
      if (navigator.userAgentData && navigator.userAgentData.mobile === false) return true;
      if ((android || iphone) && navigator.maxTouchPoints > 0) return false;
      var p = navigator.platform || '';
      if (/Win32|Win64|MacIntel/i.test(p)) return true;
      if (navigator.maxTouchPoints === 0) return true;
      try {
        if (navigator.maxTouchPoints === 0 && window.matchMedia('(pointer: fine)').matches && window.matchMedia('(hover: hover)').matches) return true;
      } catch (e) {}
      return false;
    }

    function setTitle(t) {
      if (t) document.title = t;
    }

    function renderSafeBanner() {
      return '<div class="safe-banner"><span class="safe-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none"><path d="M12 2l7 3v6c0 5-3.5 9-7 11-3.5-2-7-6-7-11V5l7-3z" fill="currentColor" opacity=".18"/><path d="M9.2 12.1l1.9 1.9 4.8-4.8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span>安全验证</span></div>';
    }

    function buildPage(inner) {
      return inner;
    }

    function renderBase(data, inner) {
      var customTitle = data.title && data.title !== '安全验证';
      var html = '<div class="page">';
      if (Number(data.safety) === 1) {
        html += renderSafeBanner();
      }
      html += '<main class="main">';
      if (customTitle) {
        html += '<h1 class="page-title">' + escapeHtml(data.title) + '</h1>';
      }
      html += '<div class="media-wrap">' + inner + '</div>';
      if (data.beizhu) html += '<div class="note">' + escapeHtml(data.beizhu) + '</div>';
      html += '</main></div>';
      return html;
    }

    function renderWarn(data) {
      setTitle(data.title || '提示');
      return renderBase(data, '<div class="warn-box"><div class="warn-icon">!</div><p class="warn-text">' +
              escapeHtml(data.warn_text || data.message || '无法访问') + '</p></div>');
    }

    function renderNotFound(msg) {
      setTitle('404');
      return buildPage('<div class="page"><main class="main"><div class="warn-box"><div class="warn-icon">?</div><p class="warn-text">' +
              escapeHtml(msg || '活码不存在') + '</p></div></main></div>');
    }

    function renderIframe(data) {
      var url = data.target_url || data.zm_url || '';
      if (data.title) setTitle(data.title);
      return '<iframe class="lc-full-iframe" src="' + escapeHtml(url) + '" title="content" referrerpolicy="no-referrer-when-downgrade"></iframe>';
    }

    function mountIframe(data) {
      document.body.classList.add('iframe-mode');
      var app = document.getElementById('app');
      app.classList.add('iframe-mode');
      app.innerHTML = renderIframe(data);
      hideLoading();
    }

    function renderDisplay(data) {
      setTitle(data.title || '安全验证');
      var forceOpen = Number(data.force_open) === 1;
      var zmUrl = data.zm_url || '';
      var zmQrcode = data.zm_qrcode || '';
      var imgHtml;
      if (data.redirect && zmUrl && !forceOpen) {
        imgHtml = '<a class="qrcode-link" href="' + escapeHtml(zmUrl) + '"><img src="' + escapeHtml(zmQrcode) + '" alt="qrcode" /></a>';
      } else if (data.redirect && zmUrl && forceOpen) {
        imgHtml = '<a class="qrcode-link lc-open-iframe" href="javascript:void(0)" data-url="' + escapeHtml(zmUrl) + '"><img src="' + escapeHtml(zmQrcode) + '" alt="qrcode" /></a>';
      } else if (zmQrcode) {
        imgHtml = '<div class="qrcode-box"><img src="' + escapeHtml(zmQrcode) + '" alt="qrcode" /></div>';
      } else if (zmUrl) {
        imgHtml = '<p style="text-align:center"><a href="' + escapeHtml(zmUrl) + '" style="color:#2563eb;font-size:16px">点击打开链接</a></p>';
      } else {
        imgHtml = '<p class="warn-text" style="text-align:center">暂无展示内容</p>';
      }
      var html = renderBase(data, imgHtml);
      var timer = Number(data.timer) || 0;
      var autoJump = Number(data.auto_jump) === 1;
      if (!forceOpen && zmUrl && autoJump) {
        var delayMs = timer > 0 ? timer * 1000 : 0;
        setTimeout(function () { location.href = zmUrl; }, delayMs);
      } else if (!forceOpen && timer > 0 && zmUrl) {
        setTimeout(function () { location.href = zmUrl; }, timer * 1000);
      } else if (forceOpen && timer > 0 && zmUrl) {
        setTimeout(function () { mountIframe(Object.assign({}, data, { target_url: zmUrl })); }, timer * 1000);
      }
      return html;
    }

    function trackEvent(gateKey, eventType) {
      if (!gateKey) return;
      fetch(getApiBase() + '/gate/' + encodeURIComponent(gateKey) + '/event', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ eventType: eventType })
      }).catch(function () {});
    }

    function applyPayload(payload) {
      var app = document.getElementById('app');
      var mode = payload.mode || 'warn';
      var data = payload.data || {};
      var gateKey = data.gate_key || getGateKey();

      if (mode !== 'guide_mobile' && Number(data.device_limit) === 1 && isLikelyDesktopBrowser()) {
        applyPayload({
          mode: 'guide_mobile',
          data: {
            title: data.title || '提示',
            warn_text: '请使用手机浏览器访问',
            safety: data.safety,
            device_limit: 1
          }
        });
        return;
      }

      // 网址码：接口返回 redirect，直接跳转
      if (mode === 'redirect' && data.target_url) {
        setTitle(data.title || '跳转');
        trackEvent(gateKey, 1);
        location.replace(data.target_url);
        return;
      }
      if (mode === 'iframe') {
        trackEvent(gateKey, 1);
        mountIframe(data);
        return;
      }
      if (mode === 'display') {
        trackEvent(gateKey, 1);
        app.innerHTML = renderDisplay(data);
      } else if (mode === 'warn' || mode === 'guide_wechat' || mode === 'guide_mobile') {
        app.innerHTML = renderWarn(data);
      } else {
        app.innerHTML = renderNotFound(payload.message);
      }
      hideLoading();
    }

    function requestRender(tk, sig) {
      var key = tk || getGateKey();
      var apiBase = getApiBase();
      if (!key) {
        applyPayload({ mode: 'not_found', message: '缺少活码tk' });
        return;
      }
      if (!apiBase) {
        applyPayload({ mode: 'not_found', message: '请配置 api_base 参数' });
        return;
      }
      var body = new URLSearchParams();
      body.append('key', key);
      if (sig) body.append('sig', sig);
      fetch(apiBase + '/api/livecode/render', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
        body: body.toString()
      })
              .then(function (res) { return res.json().then(function (data) { return { ok: res.ok, data: data }; }); })
              .then(function (r) {
                if (r.data && r.data.mode) {
                  applyPayload(r.data);
                } else {
                  applyPayload({ mode: 'not_found', message: (r.data && r.data.message) || '加载失败' });
                }
              })
              .catch(function () {
                applyPayload({ mode: 'not_found', message: '网络错误，请稍后重试' });
              });
    }

    function requestHop() {
      var key = getGateKey();
      var apiBase = getApiBase();
      var stage = getParam('hop') || 'entry';
      var sig = getParam('sig') || '';
      if (!key) {
        applyPayload({ mode: 'not_found', message: '缺少活码tk' });
        return;
      }
      if (!apiBase) {
        applyPayload({ mode: 'not_found', message: '请配置 api_base 参数' });
        return;
      }
      var body = new URLSearchParams();
      body.append('tk', key);
      body.append('stage', stage);
      body.append('host', location.host);
      if (sig) body.append('sig', sig);
      fetch(apiBase + '/api/livecode/hop', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
        body: body.toString()
      })
        .then(function (res) { return res.json(); })
        .then(function (r) {
          if (r.action === 'redirect' && r.url) {
            location.replace(r.url);
            return;
          }
          if (r.action === 'render') {
            requestRender(r.tk || key, r.sig || sig);
            return;
          }
          if (r.action === 'warn') {
            applyPayload({ mode: 'warn', data: { warn_text: r.message || '无法访问' } });
            return;
          }
          applyPayload({ mode: 'not_found', message: r.message || '加载失败' });
        })
        .catch(function () {
          applyPayload({ mode: 'not_found', message: '网络错误，请稍后重试' });
        });
    }

    document.addEventListener('click', function (e) {
      var a = e.target.closest('.lc-open-iframe');
      if (!a) return;
      e.preventDefault();
      var url = a.getAttribute('data-url');
      mountIframe({ target_url: url, zm_url: url });
    });

    requestHop();
  })();
</script>
</body>
</html>
